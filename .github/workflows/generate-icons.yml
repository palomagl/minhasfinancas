name: Build original green wallet icons
on:
  push:
    paths:
      - scripts/generate-icons.py
      - .github/workflows/generate-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate-icons.py
      - name: Save generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/favicon-32.png icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png
          git diff --staged --quiet || (git commit -m "design: sync favicon and PWA icons with original green wallet" && git push)
