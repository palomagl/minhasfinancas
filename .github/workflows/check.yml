name: Validate Finanças 2.0
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check app.js
          node --check finance2.js
          node --check finance-core.mjs
          node --test tests/*.test.mjs
          node -e 'JSON.parse(require("fs").readFileSync("manifest.webmanifest","utf8"))'
      - name: Ensure Finanças 2.0 uses separate collections
        run: |
          grep -q "v2_users" app.js
          grep -q "v2_families" finance2.js
          grep -q "match /users/" firestore.rules
          grep -q "match /v2_users/" firestore.rules
